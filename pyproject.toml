[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paretobandits"
dynamic = ["version"]
description = "Multi-objective contextual bandits under distribution shift: algorithms, benchmarks, and metrics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Apurv Shukla", email = "apurv.shukla@umich.edu" },
    { name = "P. R. Kumar", email = "prk@tamu.edu" },
]
keywords = [
    "contextual-bandits",
    "multi-objective",
    "pareto",
    "covariate-shift",
    "online-learning",
    "machine-learning",
    "reinforcement-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
warfarin = ["pandas>=1.4", "openpyxl>=3.0", "xlrd>=2.0"]
viz = ["matplotlib>=3.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "build>=1.0",
    "twine>=4.0",
]
all = [
    "pandas>=1.4",
    "openpyxl>=3.0",
    "xlrd>=2.0",
    "matplotlib>=3.5",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/apurvshukla/paretobandits"
Repository = "https://github.com/apurvshukla/paretobandits"
Issues = "https://github.com/apurvshukla/paretobandits/issues"
Changelog = "https://github.com/apurvshukla/paretobandits/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["paretobandits*"]
exclude = ["tests*", "examples*", "benchmarks*", "docs*"]

[tool.setuptools.dynamic]
version = { attr = "paretobandits.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["paretobandits"]
omit = ["tests/*", "examples/*", "benchmarks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["script", "test_results"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (we use line-length but allow some leniency)
    "E741",   # ambiguous variable names — math notation needs them
    "B008",   # function calls in defaults — common in our API
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]                # allow assert False in tests
"examples/*" = ["E402"]              # allow imports below docstrings
"paretobandits/__init__.py" = ["F401"]  # re-exports
"paretobandits/algos/__init__.py" = ["F401"]
"paretobandits/algos/legacy/__init__.py" = ["F401"]
"paretobandits/core/__init__.py" = ["F401"]
"paretobandits/envs/__init__.py" = ["F401"]
"paretobandits/eval/__init__.py" = ["F401"]
"paretobandits/utils/__init__.py" = ["F401"]
